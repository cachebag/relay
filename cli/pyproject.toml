[project]
name = "relay"
version = "0.3.3+aeccbba0388aa73cb0e627f5175356e6b46c45bf"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.0",
]

[project.scripts]
relay = "relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pytest"]
