name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Golang checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

  cli:
    name: CLI (Python) checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - run: uv sync --all-groups

      - run: uv run ruff check .

      - run: uv run pytest
      
      - name: Build wheel
        run: uv build --wheel
        
      - name: Install wheel as a tool and smoke-test it
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
        run: |
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/relay" --version
          "$UV_TOOL_BIN_DIR/relay" --help
